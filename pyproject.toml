[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gmail-readonly-mcp"
version = "0.1.0"
description = "Account-isolated, scope-verified Gmail read-only setup for workspace-mcp"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "workspace-mcp==2.1.0",
  "google-auth-oauthlib>=1.2,<2",
  "platformdirs>=4,<5",
  "requests>=2.32,<3",
]

[project.scripts]
gmail-readonly-mcp = "gmail_readonly_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_readonly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
